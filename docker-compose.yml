services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_ops
      POSTGRES_PASSWORD: agent_ops_dev
      POSTGRES_DB: agent_ops
    volumes:
      - agent_ops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_ops -d agent_ops"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgres://agent_ops:agent_ops_dev@postgres:5432/agent_ops?sslmode=disable
      HTTP_ADDR: :8080
      CORS_ORIGINS: http://127.0.0.1:${SMOKE_CLIENT_PORT:-4173},http://localhost:${SMOKE_CLIENT_PORT:-4173}
      SCM_REPOSITORIES_JSON: '[]'
    ports:
      - "127.0.0.1:${SMOKE_API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  agent_ops_postgres:
