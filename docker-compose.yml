services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_ops
      POSTGRES_PASSWORD: agent_ops_dev
      POSTGRES_DB: agent_ops
    volumes:
      - agent_ops_postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH-127.0.0.1}:${POSTGRES_HOST_PORT-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_ops -d agent_ops"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgres://agent_ops:agent_ops_dev@postgres:5432/agent_ops?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for local API}
      REPOSITORY_ENCRYPTION_KEY: ${REPOSITORY_ENCRYPTION_KEY:?REPOSITORY_ENCRYPTION_KEY must be set for local API}
      HTTP_ADDR: :8080
      CORS_ORIGINS: http://127.0.0.1:${SMOKE_CLIENT_PORT:-4173},http://localhost:${SMOKE_CLIENT_PORT:-4173}
      SCM_REPOSITORIES_JSON: ${SCM_REPOSITORIES_JSON:-[]}
      SMOKE_ORGANIZATION_ID: ${SMOKE_ORGANIZATION_ID:-}
      SMOKE_GITLAB_FIXTURE_URL: ${SMOKE_GITLAB_FIXTURE_URL:-http://host.docker.internal:18081}
      SMOKE_WEBHOOK_SECRET: ${SMOKE_WEBHOOK_SECRET:-fixture-webhook-secret}
      SMOKE_BACKFILL_TOKEN: ${SMOKE_BACKFILL_TOKEN:-fixture-backfill-token}
    ports:
      - "127.0.0.1:${SMOKE_API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  client:
    build:
      context: .
      dockerfile: ${PWD}/deploy/local/Dockerfile
      additional_contexts:
        client: ${CLIENT_DIR:-../agent-ops-client}
      args:
        APP_API_URL: /api
    ports:
      - "127.0.0.1:${SMOKE_CLIENT_PORT:-4173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  agent_ops_postgres:
