services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-agent_ops}
    volumes:
      - agent_ops_production_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agent_ops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_ops}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REPOSITORY_ENCRYPTION_KEY: ${REPOSITORY_ENCRYPTION_KEY:?REPOSITORY_ENCRYPTION_KEY must be set}
      HTTP_ADDR: :8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:${PRODUCTION_CLIENT_PORT:-18081},http://localhost:${PRODUCTION_CLIENT_PORT:-18081}}
      SCM_REPOSITORIES_JSON: ${SCM_REPOSITORIES_JSON:-[]}
    ports:
      - "127.0.0.1:${PRODUCTION_API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  client:
    build:
      context: ${CLIENT_DIR:?CLIENT_DIR must point to the client checkout}
      dockerfile: Dockerfile
      args:
        APP_API_URL: /api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "127.0.0.1:${PRODUCTION_CLIENT_PORT:-18081}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  agent_ops_production_postgres:
