version: "2"
run:
  timeout: "5m"
  concurrency: 10
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable: [govet, errcheck, ineffassign, staticcheck, unused]
  settings:
    staticcheck:
      checks: ["SA*"]
  exclusions:
    rules:
      - path: "(^|/)scratchpad/"
        linters: [govet, errcheck, ineffassign, staticcheck, unused]
formatters:
  enable: [gofmt, goimports]
  settings:
    gofmt:
      simplify: true
  exclusions:
    paths: ["(^|/)scratchpad/"]
