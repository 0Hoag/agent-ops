basePath: /
definitions:
  board.ListMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  board.ListResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/board.ListMeta'
    type: object
  response.ErrorResponse:
    properties:
      message:
        type: string
      status:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for repository synchronization and signed webhooks.
  title: Agent Ops API
  version: "1.0"
paths:
  /api/v1/board:
    get:
      parameters:
      - description: Repository UUID
        in: query
        name: repository_id
        required: true
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/board.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List board issues
  /api/v1/repositories:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/board.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List repositories
  /api/v1/webhooks/{provider}:
    post:
      responses: {}
      summary: Ingest provider webhook
swagger: "2.0"
