host: localhost:8080
info:
  contact: {}
  description: API for repository synchronization and signed webhooks.
  title: Agent Ops API
  version: "1.0"
paths:
  /api/v1/agent-runs:
    get:
      parameters:
      - description: Repository UUID
        in: query
        name: repository_id
        type: string
      - description: Wave
        in: query
        name: wave
        type: string
      - description: Issue number
        in: query
        name: issue_number
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agentrun.AgentRun'
            type: array
      summary: List agent runs
    post:
      consumes:
      - application/json
      parameters:
      - description: Static agent run token
        in: header
        name: X-Agent-Run-Token
        required: true
        type: string
      - description: Agent run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agentrun.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agentrun.AgentRun'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Create an agent run
  /api/v1/agent-runs/aggregate:
    get:
      parameters:
      - description: Repository UUID
        in: query
        name: repository_id
        type: string
      - description: Wave
        in: query
        name: wave
        type: string
      - description: Issue number
        in: query
        name: issue_number
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agentrun.Aggregate'
            type: array
      summary: Aggregate agent runs
  /api/v1/board:
    get:
      parameters:
      - description: Repository UUID
        in: query
        name: repository_id
        required: true
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/board.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List board issues
  /api/v1/repositories:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/board.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List repositories
  /api/v1/webhooks/{provider}:
    post:
      responses: {}
      summary: Ingest provider webhook
swagger: "2.0"
