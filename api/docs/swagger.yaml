basePath: /
definitions:
  agentrun.AgentRun:
    properties:
      cache_write_tokens:
        type: integer
      cached_input_tokens:
        type: integer
      cost_usd:
        type: number
      created_at:
        type: string
      ended_at:
        type: string
      id:
        type: string
      input_tokens:
        type: integer
      issue_numbers:
        items:
          type: integer
        type: array
      model:
        type: string
      output_tokens:
        type: integer
      pr_number:
        type: integer
      reasoning_tokens:
        type: integer
      repository_id:
        type: string
      started_at:
        type: string
      updated_at:
        type: string
      wave:
        type: string
      worker:
        type: string
    type: object
  agentrun.Aggregate:
    properties:
      cache_write_tokens:
        type: integer
      cached_input_tokens:
        type: integer
      cost_usd:
        type: number
      input_tokens:
        type: integer
      issue_number:
        type: integer
      output_tokens:
        type: integer
      reasoning_tokens:
        type: integer
      runs:
        type: integer
      wave:
        type: string
      worker:
        type: string
    type: object
  agentrun.AggregateResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/agentrun.Aggregate'
        type: array
      status:
        type: integer
    type: object
  agentrun.CreateInput:
    properties:
      cache_write_tokens:
        type: integer
      cached_input_tokens:
        type: integer
      ended_at:
        type: string
      input_tokens:
        type: integer
      issue_numbers:
        items:
          type: integer
        type: array
      model:
        type: string
      output_tokens:
        type: integer
      pr_number:
        type: integer
      reasoning_tokens:
        type: integer
      repository_id:
        type: string
      started_at:
        type: string
      wave:
        type: string
      worker:
        type: string
    required:
    - ended_at
    - model
    - repository_id
    - started_at
    - wave
    - worker
    type: object
  agentrun.CreatedResponse:
    properties:
      data:
        $ref: '#/definitions/agentrun.AgentRun'
      status:
        type: integer
    type: object
  agentrun.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/agentrun.AgentRun'
        type: array
      status:
        type: integer
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      token:
        type: string
    type: object
  auth.SelectOrganizationRequest:
    properties:
      organization_id:
        type: string
    type: object
  auth.SessionResponse:
    properties:
      account_id:
        type: string
      email:
        type: string
      organization_id:
        type: string
    type: object
  board.ListMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  board.ListResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/board.ListMeta'
    type: object
  insight.CycleMetric:
    properties:
      completed:
        type: integer
      evidence:
        items:
          $ref: '#/definitions/insight.Evidence'
        type: array
      median_seconds:
        type: number
    type: object
  insight.Envelope:
    properties:
      data:
        $ref: '#/definitions/insight.Response'
    type: object
  insight.Evidence:
    properties:
      delivery_id:
        type: string
      event_type:
        type: string
      issue_number:
        type: integer
      pr_number:
        type: integer
      received_at:
        type: string
      source_at:
        type: string
    type: object
  insight.FirstCIMetric:
    properties:
      eligible:
        type: integer
      evidence:
        items:
          $ref: '#/definitions/insight.Evidence'
        type: array
      rate:
        type: number
      successful:
        type: integer
    type: object
  insight.History:
    properties:
      complete:
        type: boolean
      reason:
        type: string
    type: object
  insight.Response:
    properties:
      cycle_time:
        $ref: '#/definitions/insight.CycleMetric'
      first_ci_success:
        $ref: '#/definitions/insight.FirstCIMetric'
      history:
        $ref: '#/definitions/insight.History'
      repository_id:
        type: string
      send_back:
        $ref: '#/definitions/insight.SendBackMetric'
      suggestions:
        items:
          $ref: '#/definitions/insight.Suggestion'
        type: array
    type: object
  insight.SendBackMetric:
    properties:
      count:
        type: integer
      denominator:
        type: integer
      evidence:
        items:
          $ref: '#/definitions/insight.Evidence'
        type: array
      numerator:
        type: integer
      rate:
        type: number
    type: object
  insight.Suggestion:
    properties:
      evidence:
        items:
          $ref: '#/definitions/insight.Evidence'
        type: array
      key:
        type: string
      message:
        type: string
      occurrences:
        type: integer
    type: object
  organization.AddMemberRequest:
    properties:
      account_id:
        type: string
      role:
        type: string
    required:
    - account_id
    - role
    type: object
  organization.CreateRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  organization.UpdateRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  response.ErrorResponse:
    properties:
      message:
        type: string
      status:
        type: integer
    type: object
  response.MessageResponse:
    properties:
      message:
        type: string
      status:
        type: integer
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      status:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for repository synchronization and signed webhooks.
  title: Agent Ops API
  version: "1.0"
paths:
  /api/v1/agent-runs:
    get:
      parameters:
      - description: Repository UUID
        in: query
        name: repository_id
        type: string
      - description: Wave
        in: query
        name: wave
        type: string
      - description: Issue number
        in: query
        name: issue_number
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agentrun.ListResponse'
      summary: List agent runs
    post:
      consumes:
      - application/json
      parameters:
      - description: Static agent run token
        in: header
        name: X-Agent-Run-Token
        required: true
        type: string
      - description: Agent run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agentrun.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agentrun.CreatedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - AgentRunToken: []
      summary: Create an agent run
  /api/v1/agent-runs/aggregate:
    get:
      parameters:
      - description: Repository UUID
        in: query
        name: repository_id
        type: string
      - description: Wave
        in: query
        name: wave
        type: string
      - description: Issue number
        in: query
        name: issue_number
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agentrun.AggregateResponse'
      summary: Aggregate agent runs
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login
  /api/v1/auth/select-organization:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer account token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Organization
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SelectOrganizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Select organization
  /api/v1/auth/session:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Current session
  /api/v1/board:
    get:
      parameters:
      - description: Repository UUID
        in: query
        name: repository_id
        required: true
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/board.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List board issues
  /api/v1/board/ws:
    get:
      parameters:
      - description: Repository UUID
        format: uuid
        in: query
        name: repository_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Board invalidation websocket handshake
  /api/v1/insights:
    get:
      parameters:
      - description: Repository UUID
        format: uuid
        in: query
        name: repository_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/insight.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get repository insights
  /api/v1/organizations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List organizations
    post:
      consumes:
      - application/json
      parameters:
      - description: Organization
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/organization.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Create organization
  /api/v1/organizations/{organization_id}:
    get:
      parameters:
      - description: Organization UUID
        in: path
        name: organization_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Organization detail
  /api/v1/organizations/{organization_id}/members:
    get:
      parameters:
      - description: Organization UUID
        in: path
        name: organization_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List organization members
    post:
      consumes:
      - application/json
      parameters:
      - description: Organization UUID
        in: path
        name: organization_id
        required: true
        type: string
      - description: Membership
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/organization.AddMemberRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Add organization member
  /api/v1/organizations/{organization_id}/members/{account_id}:
    delete:
      parameters:
      - description: Organization UUID
        in: path
        name: organization_id
        required: true
        type: string
      - description: Account UUID
        in: path
        name: account_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Remove organization member
    patch:
      consumes:
      - application/json
      parameters:
      - description: Organization UUID
        in: path
        name: organization_id
        required: true
        type: string
      - description: Account UUID
        in: path
        name: account_id
        required: true
        type: string
      - description: Role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/organization.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Update member role
  /api/v1/repositories:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/board.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List repositories
  /api/v1/webhooks/{provider}:
    post:
      consumes:
      - application/json
      parameters:
      - description: SCM provider
        in: path
        name: provider
        required: true
        type: string
      - description: GitHub HMAC signature
        in: header
        name: X-Hub-Signature-256
        type: string
      - description: GitLab webhook token
        in: header
        name: X-Gitlab-Token
        type: string
      - description: Provider webhook payload
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Ingest provider webhook
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      summary: Process health
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Database readiness
securityDefinitions:
  AgentRunToken:
    in: header
    name: X-Agent-Run-Token
    type: apiKey
swagger: "2.0"
