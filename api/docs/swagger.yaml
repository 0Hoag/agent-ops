host: localhost:8080
info:
  contact: {}
  description: API for repository synchronization and signed webhooks.
  title: Agent Ops API
  version: "1.0"
paths:
  /api/v1/agent-run-prices:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: List model price versions
    post:
      consumes:
      - application/json
      parameters:
      - description: Price version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agentrun.PriceVersion'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Create model price version
  /api/v1/agent-run-prices/{price_id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Price version UUID
        in: path
        name: price_id
        required: true
        type: string
      - description: Price version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agentrun.PriceVersion'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Update model price version
  /api/v1/agent-runs:
    get:
      parameters:
      - description: Repository UUID
        in: query
        name: repository_id
        type: string
      - description: Wave
        in: query
        name: wave
        type: string
      - description: Issue number
        in: query
        name: issue_number
        type: integer
      - description: Pull request number
        in: query
        name: pr_number
        type: integer
      - description: Harness identity
        in: query
        name: harness
        type: string
      - description: Model identity
        in: query
        name: model
        type: string
      - description: RFC3339 lower bound
        in: query
        name: started_after
        type: string
      - description: RFC3339 upper bound
        in: query
        name: started_before
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, maximum 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agentrun.ListResponse'
      summary: List organization-scoped agent runs
    post:
      consumes:
      - application/json
      parameters:
      - description: Static agent run token
        in: header
        name: X-Agent-Run-Token
        required: true
        type: string
      - description: Agent run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agentrun.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agentrun.CreatedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - AgentRunToken: []
      summary: Create an agent run
  /api/v1/agent-runs/{run_id}/timeline:
    get:
      parameters:
      - description: Run UUID
        in: path
        name: run_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Get run timeline
    post:
      consumes:
      - application/json
      parameters:
      - description: Run UUID
        in: path
        name: run_id
        required: true
        type: string
      - description: Sanitized steps
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agentrun.TimelineInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
      security:
      - AgentRunToken: []
      summary: Ingest run timeline
  /api/v1/agent-runs/aggregate:
    get:
      parameters:
      - description: Repository UUID
        in: query
        name: repository_id
        type: string
      - description: Wave
        in: query
        name: wave
        type: string
      - description: Issue number
        in: query
        name: issue_number
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agentrun.AggregateResponse'
      summary: Aggregate agent runs
  /api/v1/alerts/history:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/alert.HistoryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List alert history
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login
  /api/v1/auth/select-organization:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer account token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Organization
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SelectOrganizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Select organization
  /api/v1/auth/session:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Current session
  /api/v1/board:
    get:
      parameters:
      - description: Repository UUID
        in: query
        name: repository_id
        required: true
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/board.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List board issues
  /api/v1/board/ws:
    get:
      parameters:
      - description: Repository UUID
        format: uuid
        in: query
        name: repository_id
