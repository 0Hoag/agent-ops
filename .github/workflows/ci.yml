name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
        working-directory: api
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: api
      - run: go test ./...
        working-directory: api
      - run: go build ./...
        working-directory: api
